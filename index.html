<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>正在施工 · 敬请期待</title>
<meta name="description" content="本站正在施工中，敬请期待。" />
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg: #0d1117;
    --bg-2: #11161f;
    --line: rgba(255, 255, 255, 0.06);
    --ink: #e8edf5;
    --muted: #8b98ab;
    --yellow: #ffc93c;
    --yellow-deep: #f0a500;
    --orange: #ff7a18;
    --card: rgba(22, 28, 38, 0.72);
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(255, 201, 60, 0.14), transparent 65%),
      radial-gradient(700px 500px at 85% 110%, rgba(255, 122, 24, 0.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow-x: hidden;
  }

  /* 蓝图网格 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    pointer-events: none;
    z-index: 0;
  }

  /* 顶部 / 底部警示带 */
  .tape {
    position: fixed;
    left: -10%;
    width: 120%;
    height: 26px;
    z-index: 3;
    background: repeating-linear-gradient(
      -45deg,
      var(--yellow) 0 22px,
      #14181f 22px 44px
    );
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.55);
    animation: tape-slide 2.4s linear infinite;
  }
  .tape.top { top: 0; }
  .tape.bottom { bottom: 0; animation-direction: reverse; }

  @keyframes tape-slide {
    from { background-position: 0 0; }
    to   { background-position: 62.2px 0; }
  }

  .stage {
    position: relative;
    z-index: 2;
    width: min(760px, calc(100% - 40px));
    margin: 64px 0;
    padding: 44px 40px 40px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
    animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(22px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  /* 塔吊 */
  .crane {
    width: 190px;
    height: 120px;
    margin: 0 auto 6px;
    display: block;
    overflow: visible;
  }
  .crane .swing {
    transform-origin: 96px 34px;
    animation: swing 6s ease-in-out infinite;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(4deg); }
  }
  .crane .hook {
    animation: hook 3.2s ease-in-out infinite;
  }
  @keyframes hook {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(9px); }
  }
  .crane .blink {
    animation: blink 1.4s steps(1, end) infinite;
  }
  @keyframes blink {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    margin-bottom: 18px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--yellow);
    background: rgba(255, 201, 60, 0.10);
    border: 1px solid rgba(255, 201, 60, 0.32);
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 0 0 rgba(255, 201, 60, 0.6);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 201, 60, 0.55); }
    70%  { box-shadow: 0 0 0 12px rgba(255, 201, 60, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 201, 60, 0); }
  }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(38px, 8vw, 68px);
    line-height: 1.06;
    letter-spacing: 0.06em;
    font-weight: 800;
    background: linear-gradient(180deg, #fff 0%, var(--yellow) 62%, var(--orange) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(255, 201, 60, 0.18);
  }

  .sub {
    margin: 0 auto;
    max-width: 30em;
    font-size: clamp(14px, 2.4vw, 16px);
    line-height: 1.85;
    color: var(--muted);
  }

  footer {
    position: relative;
    z-index: 2;
    padding: 0 20px 46px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: rgba(139, 152, 171, 0.75);
    text-align: center;
  }

  @media (max-width: 560px) {
    .stage { padding: 34px 22px 32px; margin: 52px 0; }
    .crane { width: 150px; height: 96px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="tape top" aria-hidden="true"></div>
  <div class="tape bottom" aria-hidden="true"></div>

  <main class="stage">
    <svg class="crane" viewBox="0 0 190 120" fill="none" aria-hidden="true">
      <!-- 塔身 -->
      <path d="M92 34 L92 112 M100 34 L100 112" stroke="#3b4658" stroke-width="3" stroke-linecap="round"/>
      <path d="M92 46 L100 54 M100 46 L92 54 M92 62 L100 70 M100 62 L92 70 M92 78 L100 86 M100 78 L92 86 M92 94 L100 102 M100 94 L92 102"
            stroke="#2c3543" stroke-width="2" stroke-linecap="round"/>
      <!-- 底座 -->
      <path d="M78 112 L114 112" stroke="#4a566b" stroke-width="4" stroke-linecap="round"/>
      <!-- 吊臂 -->
      <g class="swing">
        <path d="M96 34 L20 34" stroke="#5a6a83" stroke-width="3" stroke-linecap="round"/>
        <path d="M96 34 L168 34" stroke="#5a6a83" stroke-width="3" stroke-linecap="round"/>
        <path d="M96 34 L96 20 L120 34" stroke="#5a6a83" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M96 20 L96 34" stroke="#3b4658" stroke-width="2"/>
        <!-- 配重 -->
        <rect x="150" y="34" width="18" height="12" rx="2" fill="#3b4658"/>
        <!-- 小车与吊钩 -->
        <g class="hook">
          <rect x="44" y="31" width="12" height="6" rx="1.5" fill="#ffc93c"/>
          <path d="M50 37 L50 74" stroke="#8b98ab" stroke-width="1.6"/>
          <path d="M50 74 q0 8 7 8 q6 0 6 -6" stroke="#ffc93c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </g>
        <!-- 警示灯 -->
        <circle class="blink" cx="96" cy="17" r="3.4" fill="#ff7a18"/>
      </g>
    </svg>

    <div class="badge"><span class="dot"></span>UNDER CONSTRUCTION · 施工中</div>

    <h1>正在施工</h1>
    <p class="sub">
      本站正在紧张搭建中，部分页面暂时无法访问。<br />
      工人师傅正在加班加点，请稍后再来 —— 感谢你的耐心等待。
    </p>
  </main>

  <footer>© <span id="year">2026</span> 本站 · 施工期间如有不便，敬请谅解</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
