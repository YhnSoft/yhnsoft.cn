<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旋转鸡块 · SPINNING NUGGET</title>
<meta name="description" content="一块被 Cloudflare 边缘网络均匀加热的旋转鸡块。" />
<meta name="theme-color" content="#0b0906" />
<style>
  :root {
    --bg: #0b0906;
    --ink: #f6ecd9;
    --gold: #ffc93c;
    --gold-deep: #e8890c;
    --ember: #ff7a18;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1000px 620px at 50% 24%, rgba(255, 160, 40, 0.16), transparent 62%),
      radial-gradient(760px 520px at 82% 96%, rgba(255, 90, 20, 0.11), transparent 60%),
      radial-gradient(600px 400px at 12% 8%, rgba(255, 201, 60, 0.07), transparent 65%),
      linear-gradient(180deg, #120d08 0%, var(--bg) 55%, #070503 100%);
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 78%);
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 46%, transparent 44%, rgba(0, 0, 0, 0.55) 100%);
    pointer-events: none;
  }

  .topbar {
    position: relative;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px clamp(18px, 4vw, 42px);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(246, 236, 217, 0.55);
  }
  .brand { font-weight: 700; color: rgba(246, 236, 217, 0.85); }
  .pulse { display: inline-flex; align-items: center; gap: 8px; }
  .pulse i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #63e6a2;
    animation: ping 2.2s ease-out infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(99, 230, 162, 0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(99, 230, 162, 0); }
    100% { box-shadow: 0 0 0 0 rgba(99, 230, 162, 0); }
  }

  main {
    position: relative;
    z-index: 3;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 1.6vh, 18px);
    padding: 0 20px 8px;
    text-align: center;
  }

  .scene {
    position: relative;
    width: min(460px, 84vw);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    margin-bottom: -3vh;
  }

  .glow {
    position: absolute;
    width: 72%;
    height: 72%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 170, 40, 0.42), rgba(255, 110, 10, 0.1) 46%, transparent 68%);
    filter: blur(28px);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.72; transform: scale(0.96); }
    50%      { opacity: 1;    transform: scale(1.04); }
  }

  .ring {
    position: absolute;
    width: 82%;
    height: 82%;
    border-radius: 50%;
    border: 1px dashed rgba(255, 201, 60, 0.2);
    animation: ring-spin 26s linear infinite;
  }
  .ring::after {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.045);
  }
  @keyframes ring-spin { to { transform: rotate(360deg); } }

  .bob {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    animation: bob 3.8s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(-8px); }
    50%      { transform: translateY(8px); }
  }

  #nugget {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.55));
  }

  .shadow {
    position: absolute;
    bottom: 15%;
    width: 46%;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75), transparent 72%);
    filter: blur(10px);
    animation: shadow 3.8s ease-in-out infinite;
  }
  @keyframes shadow {
    0%, 100% { transform: scale(0.88); opacity: 0.6; }
    50%      { transform: scale(1.04); opacity: 0.85; }
  }

  h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 82px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.08em;
    background: linear-gradient(180deg, #fff8e2 4%, var(--gold) 52%, var(--ember) 98%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 12px 34px rgba(255, 140, 20, 0.32));
  }

  .kicker {
    font-size: clamp(10px, 1.6vw, 12px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255, 201, 60, 0.7);
  }

  .sub {
    margin: 10px auto 0;
    max-width: 34em;
    font-size: clamp(13px, 2.2vw, 15px);
    line-height: 1.9;
    color: rgba(246, 236, 217, 0.56);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .chip {
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 201, 60, 0.82);
    background: rgba(255, 201, 60, 0.06);
    border: 1px solid rgba(255, 201, 60, 0.2);
    backdrop-filter: blur(6px);
  }

  .spin-btn {
    margin-top: 22px;
    padding: 11px 26px;
    border-radius: 999px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #2a1400;
    background: linear-gradient(180deg, #ffd763, var(--gold-deep));
    border: 0;
    cursor: pointer;
    box-shadow: 0 14px 30px rgba(232, 137, 12, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 38px rgba(232, 137, 12, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .spin-btn:active { transform: translateY(0) scale(0.985); }
  .spin-btn:focus-visible { outline: 2px solid #fff8e2; outline-offset: 4px; }

  footer {
    position: relative;
    z-index: 4;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 22px;
    padding: 16px clamp(18px, 4vw, 42px) 24px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(246, 236, 217, 0.34);
  }
  footer b { color: rgba(255, 201, 60, 0.6); font-weight: 500; }

  @media (max-width: 520px) {
    .pulse span { display: none; }
    .scene { width: 92vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .ring, .bob, .shadow { animation: none; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">yhnsoft.cn</div>
    <div class="pulse"><i aria-hidden="true"></i><span>live on cloudflare edge</span></div>
  </header>

  <main>
    <div class="scene">
      <div class="glow" aria-hidden="true"></div>
      <div class="ring" aria-hidden="true"></div>
      <div class="shadow" aria-hidden="true"></div>
      <div class="bob">
        <canvas id="nugget" role="img" aria-label="一块正在旋转的鸡块"></canvas>
      </div>
    </div>

    <p class="kicker">spinning nugget · 01</p>
    <h1>旋转鸡块</h1>
    <p class="sub">一块在边缘网络上均匀加热的鸡块。<br />它只会做一件事，但它做得很好。</p>

    <div class="chips">
      <span class="chip">100% 真实鸡肉</span>
      <span class="chip">金黄酥脆</span>
      <span class="chip">已转 <b id="revs">0</b> 圈</span>
    </div>

    <button class="spin-btn" id="toggle" type="button">暂停旋转</button>
  </main>

  <footer>
    <span>served by <b>yhnsoft-cn</b></span>
    <span>workers static assets</span>
    <span>© <b id="year">2026</b></span>
  </footer>

<script>
  (function () {
    var canvas = document.getElementById("nugget");
    var gl = canvas.getContext("webgl", { antialias: true, alpha: true });
    var revEl = document.getElementById("revs");
    var toggle = document.getElementById("toggle");
    document.getElementById("year").textContent = new Date().getFullYear();

    if (!gl) {
      canvas.insertAdjacentHTML("afterend", '<p class="sub">你的浏览器不支持 WebGL，鸡块无法旋转。</p>');
      toggle.disabled = true;
      return;
    }

    /* ---------- noise ---------- */
    function hash(x, y, z) {
      var s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
      return s - Math.floor(s);
    }
    function fade(t) { return t * t * (3 - 2 * t); }
    function vnoise(x, y, z) {
      var ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
      var fx = fade(x - ix), fy = fade(y - iy), fz = fade(z - iz);
      function n(dx, dy, dz) { return hash(ix + dx, iy + dy, iz + dz); }
      var x00 = n(0, 0, 0) + (n(1, 0, 0) - n(0, 0, 0)) * fx;
      var x10 = n(0, 1, 0) + (n(1, 1, 0) - n(0, 1, 0)) * fx;
      var x01 = n(0, 0, 1) + (n(1, 0, 1) - n(0, 0, 1)) * fx;
      var x11 = n(0, 1, 1) + (n(1, 1, 1) - n(0, 1, 1)) * fx;
      var y0 = x00 + (x10 - x00) * fy;
      var y1 = x01 + (x11 - x01) * fy;
      return y0 + (y1 - y0) * fz;
    }
    function fbm(x, y, z) {
      return vnoise(x, y, z) * 0.62 + vnoise(x * 2.13 + 5.1, y * 2.13, z * 2.13) * 0.26 +
             vnoise(x * 4.37 + 9.7, y * 4.37, z * 4.37) * 0.12;
    }

    /* ---------- mesh ---------- */
    function buildNugget() {
      var SEG = 108, RINGS = 72;
      var positions = [], indices = [];

      for (var r = 0; r <= RINGS; r++) {
        var v = r / RINGS;
        var phi = v * Math.PI;
        for (var s = 0; s <= SEG; s++) {
          var u = s / SEG;
          var theta = u * Math.PI * 2;

          var nx = Math.sin(phi) * Math.cos(theta);
          var ny = Math.cos(phi);
          var nz = Math.sin(phi) * Math.sin(theta);

          var lump = fbm(nx * 1.8 + 3.2, ny * 1.8 + 1.4, nz * 1.8 + 7.7);
          var grain = vnoise(nx * 13 + 1.1, ny * 13 + 2.2, nz * 13 + 3.3);
          var radius = 1 + (lump - 0.5) * 0.42 + (grain - 0.5) * 0.055;

          var px = nx * radius * 0.81;
          var py = ny * radius * 0.46;
          var pz = nz * radius * 0.61;

          positions.push(px, py, pz);
        }
      }

      for (var r2 = 0; r2 < RINGS; r2++) {
        for (var s2 = 0; s2 < SEG; s2++) {
          var a = r2 * (SEG + 1) + s2;
          var b = a + SEG + 1;
          indices.push(a, b, a + 1, a + 1, b, b + 1);
        }
      }

      // smooth normals from faces
      var normals = new Float32Array(positions.length);
      for (var i = 0; i < indices.length; i += 3) {
        var i0 = indices[i] * 3, i1 = indices[i + 1] * 3, i2 = indices[i + 2] * 3;
        var ax = positions[i1] - positions[i0], ay = positions[i1 + 1] - positions[i0 + 1], az = positions[i1 + 2] - positions[i0 + 2];
        var bx = positions[i2] - positions[i0], by = positions[i2 + 1] - positions[i0 + 1], bz = positions[i2 + 2] - positions[i0 + 2];
        var cx = ay * bz - az * by, cy = az * bx - ax * bz, cz = ax * by - ay * bx;
        for (var k = 0; k < 3; k++) {
          var vi = indices[i + k] * 3;
          normals[vi] += cx; normals[vi + 1] += cy; normals[vi + 2] += cz;
        }
      }
      for (var j = 0; j < normals.length; j += 3) {
        var len = Math.hypot(normals[j], normals[j + 1], normals[j + 2]) || 1;
        normals[j] /= len; normals[j + 1] /= len; normals[j + 2] /= len;
        if (normals[j] * positions[j] + normals[j + 1] * positions[j + 1] + normals[j + 2] * positions[j + 2] < 0) {
          normals[j] *= -1; normals[j + 1] *= -1; normals[j + 2] *= -1;
        }
      }

      return {
        positions: new Float32Array(positions),
        normals: normals,
        indices: new Uint16Array(indices)
      };
    }

    /* ---------- shaders ---------- */
    var VS = [
      "attribute vec3 aPos;",
      "attribute vec3 aNormal;",
      "uniform mat4 uProj;",
      "uniform mat3 uRot;",
      "varying vec3 vN;",
      "varying vec3 vP;",
      "varying vec3 vObj;",
      "void main() {",
      "  vObj = aPos;",
      "  vec3 p = uRot * aPos;",
      "  vP = p;",
      "  vN = normalize(uRot * aNormal);",
      "  gl_Position = uProj * vec4(p + vec3(0.0, 0.0, -3.7), 1.0);",
      "}"
    ].join("\n");

    var FS = [
      "precision highp float;",
      "varying vec3 vN;",
      "varying vec3 vP;",
      "varying vec3 vObj;",
      "float hash(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }",
      "float noise(vec3 p) {",
      "  vec3 i = floor(p), f = fract(p);",
      "  f = f * f * (3.0 - 2.0 * f);",
      "  float n000 = hash(i), n100 = hash(i + vec3(1,0,0));",
      "  float n010 = hash(i + vec3(0,1,0)), n110 = hash(i + vec3(1,1,0));",
      "  float n001 = hash(i + vec3(0,0,1)), n101 = hash(i + vec3(1,0,1));",
      "  float n011 = hash(i + vec3(0,1,1)), n111 = hash(i + vec3(1,1,1));",
      "  return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),",
      "             mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);",
      "}",
      "void main() {",
      "  vec3 N = normalize(vN);",
      "  vec3 V = normalize(vec3(0.0, 0.0, 3.7) - vP);",
      "  vec3 L = normalize(vec3(-0.55, 0.95, 0.8));",
      "  vec3 L2 = normalize(vec3(0.85, -0.35, -0.45));",
      "  float diff = max(dot(N, L), 0.0);",
      "  float back = max(dot(N, L2), 0.0);",
      "  vec3 H = normalize(L + V);",
      "  float spec = pow(max(dot(N, H), 0.0), 18.0);",
      "  float crumb = noise(vObj * 11.0) * 0.6 + noise(vObj * 31.0) * 0.4;",
      "  vec3 deep = vec3(0.36, 0.15, 0.03);",
      "  vec3 mid  = vec3(0.78, 0.43, 0.11);",
      "  vec3 hot  = vec3(0.97, 0.74, 0.34);",
      "  vec3 col = mix(deep, mid, smoothstep(0.06, 0.7, diff));",
      "  col = mix(col, hot, smoothstep(0.66, 1.0, diff));",
      "  col *= 0.78 + 0.44 * crumb;",
      "  col += vec3(1.0, 0.9, 0.72) * spec * 0.26;",
      "  col += vec3(1.0, 0.42, 0.08) * back * 0.16;",
      "  float rim = pow(1.0 - max(dot(N, V), 0.0), 2.6);",
      "  col += vec3(1.0, 0.58, 0.18) * rim * 0.32;",
      "  col = pow(col, vec3(0.92));",
      "  gl_FragColor = vec4(col, 1.0);",
      "}"
    ].join("\n");

    function compile(type, source) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, source);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(sh));
      }
      return sh;
    }

    var program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    var mesh = buildNugget();
    var buffers = {
      pos: gl.createBuffer(),
      nrm: gl.createBuffer(),
      idx: gl.createBuffer()
    };
    gl.bindBuffer(gl.ARRAY_BUFFER, buffers.pos);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.positions, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffers.nrm);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.normals, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.idx);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);

    var aPos = gl.getAttribLocation(program, "aPos");
    var aNormal = gl.getAttribLocation(program, "aNormal");
    gl.bindBuffer(gl.ARRAY_BUFFER, buffers.pos);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffers.nrm);
    gl.enableVertexAttribArray(aNormal);
    gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);

    var uProj = gl.getUniformLocation(program, "uProj");
    var uRot = gl.getUniformLocation(program, "uRot");

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.clearColor(0, 0, 0, 0);

    /* ---------- resize ---------- */
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      var rect = canvas.getBoundingClientRect();
      var w = Math.max(1, Math.round(rect.width * dpr));
      var h = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, w, h);
      var aspect = w / h;
      var fov = 0.62;
      var f = 1 / Math.tan(fov / 2);
      var near = 0.1, far = 12;
      gl.useProgram(program);
      gl.uniformMatrix4fv(uProj, false, new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) / (near - far), -1,
        0, 0, (2 * far * near) / (near - far), 0
      ]));
    }
    window.addEventListener("resize", resize);
    resize();

    /* ---------- loop ---------- */
    var angle = -0.55;
    var paused = false;
    var revs = 0;
    var last = performance.now();
    var tilt = -0.2;

    function rotationMatrix(ay, ax) {
      var cy = Math.cos(ay), sy = Math.sin(ay);
      var cx = Math.cos(ax), sx = Math.sin(ax);
      // Ry * Rx, stored column-major for WebGL
      return new Float32Array([
        cy, 0, -sy,
        sy * sx, cx, cy * sx,
        sy * cx, -sx, cy * cx
      ]);
    }

    function frame(now) {
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if (!paused) {
        angle += dt * 1.15;
        var done = Math.floor(angle / (Math.PI * 2));
        if (done > revs) {
          revs = done;
          revEl.textContent = String(Math.max(0, revs));
        }
      }

      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(program);
      gl.uniformMatrix3fv(uRot, false, rotationMatrix(angle, tilt));
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.idx);
      gl.drawElements(gl.TRIANGLES, mesh.indices.length, gl.UNSIGNED_SHORT, 0);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    toggle.addEventListener("click", function () {
      paused = !paused;
      toggle.textContent = paused ? "继续旋转" : "暂停旋转";
      document.querySelector(".bob").style.animationPlayState = paused ? "paused" : "running";
      document.querySelector(".shadow").style.animationPlayState = paused ? "paused" : "running";
    });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      paused = true;
      toggle.textContent = "继续旋转";
    }
  })();
</script>
</body>
</html>
